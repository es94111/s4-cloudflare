name: Update dependencies to latest

on:
  push:
    branches:
      - chore/update-dependencies-20260817
    paths:
      - .github/workflows/update-latest-dependencies-20260817.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/update-dependencies-20260817

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          check-latest: true

      - name: Upgrade package manifests to latest stable versions
        shell: bash
        run: |
          set -euo pipefail
          npx --yes npm-check-updates@latest --deep --upgrade --target latest

      - name: Refresh npm lockfiles
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' lock; do
            dir="$(dirname "$lock")"
            echo "Refreshing npm lockfile in $dir"
            (cd "$dir" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          done < <(find . -type f -name package-lock.json -not -path '*/node_modules/*' -print0)

      - name: Commit dependency updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No dependency updates were required."
            exit 0
          fi
          git commit -m "chore(deps): update dependencies to latest versions"
          git push origin HEAD:chore/update-dependencies-20260817
